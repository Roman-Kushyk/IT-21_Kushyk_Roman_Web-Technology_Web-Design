<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота 9 - To-Do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 400px;
            text-align: center;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 8px 12px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            color: white;
        }
        .btn-add { background: #007bff; }
        .btn-add:hover { background: #0056b3; }
        .btn-sort { background: #17a2b8; width: 100%; margin-bottom: 15px; }
        .btn-sort:hover { background: #138496; }
        .btn-delete { background: #dc3545; }
        .btn-delete:hover { background: #c82333; }
        
        ul { list-style: none; padding: 0; }
        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #e9ecef;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
        }
        .task-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .completed span {
            text-decoration: line-through;
            color: #6c757d;
        }
        .date-text {
            font-size: 0.8em;
            color: #555;
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>📌 To-Do List</h2>
        
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Введіть завдання...">
            <button class="btn-add" onclick="addTask()">+ Додати</button>
        </div>

        <button class="btn-sort" onclick="sortTasksByDate()">📅 Сортувати за датою</button>

        <ul id="taskList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>

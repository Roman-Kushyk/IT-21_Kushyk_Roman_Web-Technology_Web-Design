<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практична робота - DOM та події</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Практична робота: Маніпуляція DOM</h1>
    </header>

    <main>
        <section id="text-section">
            <h2>1. Маніпуляція контентом</h2>
            <p id="target-paragraph">Це базовий абзац. Натисни кнопку нижче.</p>
            <button id="change-text-btn">Змінити текст</button>
        </section>

        <section id="style-section">
            <h2>2. Зміна стилів (Hover)</h2>
            <p id="hover-element">Наведи на мене курсор, щоб змінити мій стиль!</p>
        </section>

        <section id="dynamic-section">
            <h2>3. Динамічний список завдань</h2>
            <button id="add-item-btn">Додати завдання</button>
            <ul id="elements-list"></ul> 
        </section>

        <section id="variant-section">
            <h2>4. Додаткове завдання</h2>
            <button id="variant-btn">Натисніть 5 разів!</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Практична робота з JavaScript</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>

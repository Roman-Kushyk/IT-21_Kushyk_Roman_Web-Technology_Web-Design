<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Лабораторна робота 5</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        header, main, footer {
            margin-bottom: 20px;
            padding: 15px;
            background-color: #f4f4f4;
            border: 1px solid #ddd;
        }
        .hover-box {
            padding: 10px;
            border: 1px solid black;
            display: inline-block;
            cursor: pointer;
            transition: 0.3s;
        }
        .new-item {
            border: 1px solid #333;
            padding: 5px;
            margin-top: 5px;
            background-color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <h1>Маніпуляція DOM та обробка подій</h1>
    </header>

    <main>
        <section>
            <h2>Зміна вмісту елемента</h2>
            <p id="text-to-change">Початковий текст.</p>
            <button id="btn-change">Змінити текст</button>
        </section>

        <hr>

        <section>
            <h2>Обробка подій</h2>
            <div id="hover-element" class="hover-box">Наведіть курсор на мене</div>
            <p>Наведіть курсор на елемент вище, ви побачите зміну стилю.</p>
        </section>

        <hr>

        <section>
            <h2>Додавання нового елемента</h2>
            <button id="btn-add">Додати елемент</button>
            <div id="elements-container"></div>
        </section>

        <hr>

        <section>
            <h2>Додаткове завдання</h2>
            <button id="btn-variant">Натисніть 5 разів!</button>
        </section>
    </main>

    <footer>
        <p>Лабораторна робота 5. JavaScript, DOM, події.</p>
    </footer>

    <script>
        const textToChange = document.getElementById('text-to-change');
        const btnChange = document.getElementById('btn-change');

        btnChange.addEventListener('click', function() {
            textToChange.textContent = "Текст змінено! Це новий вміст.";
        });

        const hoverElement = document.getElementById('hover-element');

        hoverElement.addEventListener('mouseover', function() {
            hoverElement.style.backgroundColor = 'yellow';
            hoverElement.style.fontSize = '18px';
        });

        hoverElement.addEventListener('mouseout', function() {
            hoverElement.style.backgroundColor = '';
            hoverElement.style.fontSize = '';
        });

        const btnAdd = document.getElementById('btn-add');
        const container = document.getElementById('elements-container');

        btnAdd.addEventListener('click', function() {
            const newItem = document.createElement('p'); 
            newItem.className = 'new-item';
            newItem.textContent = 'Це новий доданий елемент.';
            container.appendChild(newItem); 
        });

        // 4. Додаткове завдання: кнопка для 5-го варіанту
        const btnVariant = document.getElementById('btn-variant');
        let clickCount = 0; // Змінна для підрахунку кліків

        btnVariant.addEventListener('click', function() {
            clickCount++; 
            
            if (clickCount === 5) {
                alert("Роман Кушик варіант номер 5!");
                clickCount = 0; // Обнуляємо лічильник після показу alert
            }
        });
    </script>
</body>
</html>
